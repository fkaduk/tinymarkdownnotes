<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note: {{ .Slug }}</title>
    <link rel="stylesheet" href="{{ staticURL "style.css" }}">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-button active" id="preview-tab">View</button>
            <button class="tab-button" id="edit-tab">Edit</button>
            <div class="spacer"></div>
            <button class="tab-button" id="copy-link-tab">📋 Copy link</button>
        </div>

        <div id="preview"></div>

        <div id="editor-wrap">
            <form method="post">
                <div id="stale-warning" class="stale-warning" hidden>
                    Someone else saved this note. Your changes cannot be saved from this tab.
                </div>
                <textarea name="markdown" id="editor"></textarea>
                <input type="hidden" name="version" id="version-field" value="{{ .Note.Version }}">
                <div class="editor-actions">
                    <button type="submit" class="save-button" id="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize data from server
        let currentMarkdown = {{ toJSON .Note.Markdown }};
        const loadedVersion = {{ .Note.Version }};
        let latestVersion = loadedVersion;
        let isStale = false;
        let versionCheckInFlight = false;

        // Set share URL (without query params)
        const cleanUrl = window.location.origin + window.location.pathname;

        // Get DOM elements
        const previewDiv = document.getElementById('preview');
        const editorWrap = document.getElementById('editor-wrap');
        const editor = document.getElementById('editor');
        const versionField = document.getElementById('version-field');
        const form = editor.closest('form');
        const saveButton = document.getElementById('save-button');
        const staleWarning = document.getElementById('stale-warning');
        const previewTab = document.getElementById('preview-tab');
        const editTab = document.getElementById('edit-tab');
        const copyLinkTab = document.getElementById('copy-link-tab');

        // Configure markdown-it
        const md = window.markdownit({
            html: false,
            breaks: true,
            linkify: true
        }).use(window.markdownitTaskLists, {enabled: true});

        // Render markdown to preview
        function renderPreview() {
            const rawHtml = md.render(currentMarkdown);
            const cleanHtml = DOMPurify.sanitize(rawHtml);
            previewDiv.innerHTML = cleanHtml;

            // Attach checkbox listeners
            const checkboxes = previewDiv.querySelectorAll('input[type="checkbox"].task-list-item-checkbox');
            checkboxes.forEach((checkbox, index) => {
                checkbox.addEventListener('click', (e) => {
                    toggleCheckbox(index, e.target.checked);
                });
            });
        }

        // Toggle a checkbox in the markdown
        function toggleCheckbox(index, checked) {
            if (isStale) {
                updateStaleState(true);
                return;
            }
            const lines = currentMarkdown.split('\n');
            let checkboxCount = 0;

            for (let i = 0; i < lines.length; i++) {
                // Match task list: - [ ] or - [x] or - [X]
                if (lines[i].match(/^(\s*[-*+])\s+\[[ xX]\]/)) {
                    if (checkboxCount === index) {
                        // Toggle this checkbox
                        lines[i] = lines[i].replace(/\[[ xX]\]/, checked ? '[x]' : '[ ]');
                        break;
                    }
                    checkboxCount++;
                }
            }

            currentMarkdown = lines.join('\n');
            autoSave();
        }

        async function saveMarkdown(markdown) {
            const formData = new FormData();
            formData.append('markdown', markdown);
            formData.append('version', loadedVersion);

            try {
                const response = await fetch(window.location.pathname, {
                    method: 'POST',
                    body: formData
                });

                if (response.status === 409) {
                    updateStaleState(true);
                    window.alert('Someone else saved this note first. Your changes were not saved.');
                    return;
                }
                if (!response.ok) {
                    window.alert('The note could not be saved. Please try again.');
                    return;
                }
                window.location.reload();
            } catch (error) {
                console.error('Save failed:', error);
                window.alert('The note could not be saved. Please try again.');
            }
        }

        // Auto-save the note
        async function autoSave() {
            if (isStale) {
                updateStaleState(true);
                return;
            }
            await saveMarkdown(currentMarkdown);
        }

        // Show preview mode
        function showPreview() {
            if (editorWrap.style.display === 'block') {
                currentMarkdown = editor.value;
            }
            renderPreview();
            previewDiv.style.display = 'block';
            editorWrap.style.display = 'none';
            previewTab.classList.add('active');
            editTab.classList.remove('active');
        }

        // Show edit mode
        function showEdit() {
            editor.value = currentMarkdown;
            versionField.value = loadedVersion;
            previewDiv.style.display = 'none';
            editorWrap.style.display = 'block';
            previewTab.classList.remove('active');
            editTab.classList.add('active');
            updateStaleState(latestVersion > loadedVersion);
        }

        function updateStaleState(stale) {
            isStale = stale;
            staleWarning.hidden = !stale;
            saveButton.disabled = stale;
            saveButton.classList.toggle('ghosted', stale);
        }

        async function pollVersion() {
            if (versionCheckInFlight || isStale) {
                return;
            }
            versionCheckInFlight = true;
            try {
                const response = await fetch(window.location.pathname + '/meta', {
                    headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    return;
                }
                const data = await response.json();
                latestVersion = data.version;
                if (latestVersion > loadedVersion) {
                    updateStaleState(true);
                }
            } catch (error) {
                console.error('Version check failed:', error);
            } finally {
                versionCheckInFlight = false;
            }
        }

        // Tab button listeners
        previewTab.addEventListener('click', showPreview);
        editTab.addEventListener('click', showEdit);
        editor.addEventListener('input', () => {
            currentMarkdown = editor.value;
            updateStaleState(latestVersion > loadedVersion);
        });
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (isStale) {
                return;
            }
            currentMarkdown = editor.value;
            await saveMarkdown(currentMarkdown);
        });
        copyLinkTab.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(cleanUrl);
                const originalText = copyLinkTab.textContent;
                copyLinkTab.textContent = '✓ Copied';
                setTimeout(() => {
                    copyLinkTab.textContent = originalText;
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        });

        // Initialize in preview mode
        renderPreview();
        pollVersion();
        setInterval(pollVersion, 1000);
        window.addEventListener('focus', pollVersion);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                pollVersion();
            }
        });
    </script>
</body>
</html>
