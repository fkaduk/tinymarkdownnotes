<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note: {{ .Slug }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/vendor/markdown-it.min.js"></script>
    <script src="/static/vendor/markdown-it-task-lists.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-button active" id="preview-tab">View</button>
            <button class="tab-button" id="edit-tab">Edit</button>
            <div class="spacer"></div>
            <button class="tab-button" id="copy-link-tab">📋 Copy link</button>
        </div>

        <div id="preview"></div>

        <div id="editor-wrap">
            <form method="post">
                <div id="stale-warning" class="stale-warning" role="alert" hidden>
                    Someone else saved this note first, so this draft cannot be saved.
                    Copy your changes from the editor somewhere safe, then reload
                    this page to get the latest version.
                </div>
                <textarea name="markdown" id="editor">{{ .Markdown }}</textarea>
                <input type="hidden" name="version" id="version-field" value="{{ .Version }}">
                <div class="editor-actions">
                    <button type="submit" class="save-button" id="save-button">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/note.js"></script>
</body>
</html>
