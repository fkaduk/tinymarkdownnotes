name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Validate Compose config
        env:
          NOTES_ADMIN_KEY: ci-compose-validation-key
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose config
          else
            docker-compose config
          fi
