services:
  tinymarkdownnotes:
    image: "ghcr.io/fkaduk/tinymarkdownnotes:${RELEASE_VERSION:?set RELEASE_VERSION}"
    environment:
      - NOTES_ADMIN_KEY=${NOTES_ADMIN_KEY:?set NOTES_ADMIN_KEY in .env}
      - DATA_DIR=/app/data
    volumes:
      - tinymarkdownnotes_data:/app/data
    restart: unless-stopped

volumes:
  tinymarkdownnotes_data:
