version: '3.8'

services:
  notes:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NOTES_ADMIN_KEY=${NOTES_ADMIN_KEY:-change-me-in-production}
      - DATA_DIR=/app/data
      - NOTES_IMPORT_DIR=/app/notes
    volumes:
      - ./data:/app/data
      - ./notes:/app/notes:ro
    restart: unless-stopped
    user: "1000:1000"
