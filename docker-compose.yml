services:
  notes:
    build: .
    ports:
      - "${NOTES_BIND_ADDRESS:-127.0.0.1}:${NOTES_PORT:-5000}:5000"
    environment:
      - NOTES_ADMIN_KEY=${NOTES_ADMIN_KEY:?set NOTES_ADMIN_KEY in .env}
      - DATA_DIR=/app/data
      - NOTES_IMPORT_DIR=/app/notes
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${NOTES_IMPORT_DIR:-./notes}:/app/notes:ro
    restart: unless-stopped
    user: "${NOTES_UID:-1000}:${NOTES_GID:-1000}"

  caddy:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile.caddy
    depends_on:
      - notes
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
